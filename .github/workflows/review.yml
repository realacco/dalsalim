name: 코드 리뷰

# CI(ci.yml)가 "기계가 판정할 수 있는 것"을 본다면, 이 워크플로는 그 나머지를 본다 —
# 명세대로 만들었나 · 하드룰 위반 · 프로젝트 규칙. 성격이 달라서 서로를 대신하지 못한다.
#
# ⚠️ pull_request_target 을 쓰지 않는다. fork 의 코드가 secret 에 닿게 되는 트리거다.
#    지금은 개인 저장소라 fork PR 이 없고, 생기면 그때는 리뷰가 안 도는 게 맞다.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  # 액션이 OIDC 로 GitHub App 토큰을 받아온다. 없으면
  # "Could not fetch an OIDC token" 으로 3번 재시도하고 죽는다 (PR #4 에서 겪음)
  id-token: write

concurrency:
  # 같은 PR 에 연속으로 push 하면 앞의 리뷰는 버린다 — 구독 사용량을 두 번 쓸 이유가 없다
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 기능 ID 를 커밋 트레일러에서도 읽으므로 전체 이력이 필요하다

      - name: 리뷰 컨텍스트 조립
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # 기능 정의서 본문을 읽어 온다. 없으면 그 축만 빠지고 리뷰는 그대로 돈다 —
          # 차단하는 검사였다면 외부 서비스에 매달 수 없지만, 리뷰는 코멘트라 괜찮다
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node .github/scripts/review-context.mjs

      - uses: anthropics/claude-code-action@v1
        with:
          # `claude setup-token` 으로 만든 구독 토큰. API 키 대신 쓴다
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # ⚠️ 리뷰를 **보이게** 하는 건 이 둘 중 track_progress 다.
          #    `prompt:` 로 도는 agent mode 는 모델의 최종 출력을 자동으로 코멘트하지 않는다.
          #    track_progress 가 추적 코멘트를 만들고 리뷰가 그 자리에 실린다.
          #    use_sticky_comment 는 "코멘트를 여러 개 말고 하나로" 라는 뜻이라 단독으로는 아무 일도 안 한다 —
          #    실제로 PR #2~#5 는 리뷰가 다 돌고도(11턴 · 2분 22초) 코멘트가 0개였다.
          track_progress: true
          use_sticky_comment: true

          # ⚠️ allowedTools 는 **따옴표로 묶는다.** 안 묶으면 공백에서 잘려
          #    ["Bash(git", "diff:*)", "log:*)"] 가 되고 git diff 가 통째로 막힌다.
          #    PR #5 로그에서 실제로 그랬다 — 리뷰어가 diff 를 못 본 채로 저장소를 훑고 있었다.
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)"

          prompt: |
            이 PR 을 리뷰한다. **`.github/review-context.md` 를 먼저 읽는다** —
            바뀐 파일에서 거꾸로 뽑은 "걸린 기능" · "건드리는 하드룰" · **기능 정의서 본문** ·
            **diff 범위**가 거기 있다. 그 범위로 `git diff` 를 떠서 **실제로 바뀐 줄**을 본다.
            바뀌지 않은 줄은 이 PR 의 책임이 아니다.

            프로젝트 규칙의 원본은 `CLAUDE.md` 와 `.claude/rules/structure.md` 다.
            아래 3번에 자주 새는 것만 추려 뒀고, 애매하면 원문을 열어 본다.

            ## 무엇을 보나 — 이 순서로

            1. **★ 하드룰 위반.** 컨텍스트 파일이 뽑아준 항목만 본다. 하나라도 어기면
               나머지를 다 잘해도 이 PR 은 반려다. 특히 자주 새는 곳:
               - 사유 강제를 앱에서만 막고 서버에서 안 막는다 (하드룰 3)
               - `EntryLine` 의 `name`·`category` 를 복사가 아니라 참조로 바꾼다 (하드룰 4)
               - 실제 삭제로 바꾼다 — soft delete 를 되돌린다 (하드룰 6)
               - `PENDING` 이 구성원 목록·장부 정원·조회에 새어 나온다 (하드룰 8)
            2. **명세대로 도나.** 컨텍스트 파일에 「기능 정의서 본문」이 있으면 코드와 대조한다 —
               동작 정책 · 화면 구성 · 메시지가 적힌 대로인지. 이게 이 리뷰의 핵심 축이다.
               **본문이 "가져오지 않았어요"로 되어 있으면 이 축은 건너뛴다.** 명세를 모르는 채로
               추측해서 지적하지 않는다.
            3. **프로젝트 규칙.** 아래는 **세면 판정되는 것들**이라 놓치면 안 된다.
               바뀐 파일의 종류에 해당하는 묶음만 본다.

               **임포트 방향** — 파일 맨 위 `import` 만 봐도 판정된다
               - 서버는 `routes → services → lib` 한 방향. **라우트끼리 서로 임포트 금지**
               - 앱은 `app → screens → widgets → features → entities → shared` 한 방향.
                 **같은 레이어끼리 임포트 금지**
               - `prisma` 는 `services/` 에서만. 라우트가 직접 부르면 지적
               - `process.env` 는 `env.ts` 에서만
               - `lib/shared.ts` · `lib/messages.ts` 에 prisma·fastify 임포트 금지 (순수해야 한다)
               - `entities/*/model` 에 react·react-native 임포트 금지
                 (순수해야 1층에서 테스트된다)
               - `src/app/` 은 re-export 만. 화면 구현이 들어 있으면 지적
               - 화면에서 `api()` 직접 호출 금지 — `entities/<domain>/api` 를 거친다
               - `services/` 끼리는 한 방향만(`entry→book` · `family→book`). 원이 생기면 `lib/` 로 내린다

               **쪼갤 때 — 숫자로 센다**
               - 화면 하나에 `useQuery` + `useMutation` 이 **3개를 넘으면** `model/use-*.ts` 로 뺀다
               - 라우트 핸들러 하나가 `prisma` 를 **3번 이상** 부르면 `services/` 로 내린다
               - 같은 로직이 **세 번째로** 복사되면 공용으로 올린다 (두 번까지는 허용)
               - 줄 수(라우트 200 · 화면 300 · 함수 40)는 기준이 아니라 **신호**다.
                 넘었다는 것만으로 지적하지 않는다

               **화면**
               - 디자인 값 하드코딩 금지 — 색·간격·라운드·폰트 크기는
                 `shared/config/theme.ts` 토큰에서만. `'#2E7D5B'` `padding: 13` `fontSize: 15`
                 같은 리터럴이 보이면 지적
               - JSX 안에서 계산·정렬·포맷팅 금지. 금액 표시는 `shared/lib/format.ts`
               - NativeWind 금지 · `allowFontScaling={false}` 금지
               - 컨트롤드 입력에서 **입력 중 표시 형식을 바꾸지 않는다.**
                 커서가 밀린다 (시행착오 1-1). 포맷은 포커스가 빠질 때 붙인다
               - `KeyboardAvoidingView` 는 시트·카드가 아니라 **바깥 컨테이너**를 감싼다 (시행착오 1-5)
               - 같은 모양을 새로 만들기 전에 `shared/ui` 에 이미 있는지 본다
               - `shared/config` 토큰과 `shared/ui` 공용 컴포넌트를 **수정·삭제**했으면,
                 사용자 허락을 받았는지 PR 본문에서 확인한다 (신규 추가는 자유)

               **서버 응답 · 실패 표현 · 말투**
               - 조회는 `{ 리소스명 }` · 만들거나 바꾼 것은 그 리소스 · 리소스로 표현 안 되는 동작은 `{ ok: true }`
               - 실패는 `{ code, message }`. `code` 는 `lib/messages.ts` 에만 정의한다 —
                 라우트에서 문자열을 새로 만들면 지적
               - 조회 실패는 `<QueryError>` · 폼 저장 실패는 `<ErrorText>`(**입력을 잃지 않는다**) ·
                 버튼 하나짜리 동작은 `Alert` · 401 은 화면이 처리하지 않는다(`api()` 한 곳)
               - 화면·라우트에 문구 리터럴 금지
                 (`shared/config/messages.ts` · `server/src/lib/messages.ts`)
               - **해요체.** `~습니다` 는 서버 `message` 에도 쓰지 않는다(그대로 화면에 뜬다)
               - 사용자를 탓하지 않는다 · 막힌 이유가 곧 다음 행동이다 · 확인 버튼은 **제목의 동사**

               **타입 · 정리 · 보안**
               - `any` 로 빠져나가지 않는다 (서버·앱 둘 다 strict)
               - 안 쓰는 코드·주석 처리된 코드를 남기지 않는다 — 필요하면 git 에서 되찾는다
               - 주석은 **"왜"만.** 코드를 읽으면 아는 "무엇을"을 반복하면 지적.
                 반대로 하드룰 때문에 돌아간 코드에 사유 주석이 없으면 그것도 지적
               - 코드 식별자·파일명은 영어, 사용자에게 보이는 문구·주석은 한국어
               - 새 환경변수를 읽는데 `server/.env.example` 에 이름과 설명이 없으면 지적
               - 토큰은 `expo-secure-store` 에만 (AsyncStorage·전역 변수 금지) ·
                 카카오 REST 키와 client secret 이 앱 번들에 들어가면 안 된다 ·
                 가계 데이터(`EntryLine` 본문 · 카드사 문자)를 외부로 내보내지 않는다
            4. **테스트.** 하드룰을 건드렸는데 케이스가 없으면 그것만으로 지적 대상이다.
               서버와 앱에 같은 함수를 새로 두었으면 `tests/contract` 에 일치 케이스가 있어야 한다.
               시나리오 케이스에는 `★ F-XXX-NN` 이 붙어 있어야 한다(권장).
            5. **일반 버그와 코드 위생.** 위 넷과 무관한 논리 오류·경계값, 그리고 아래 여섯.
               **가장 낮은 우선순위다** — 1~4 에 걸린 게 있으면 그것부터 쓰고,
               여기 항목만으로 리뷰를 채우지 않는다.
               - 에러를 삼키지 않는다 — 빈 `catch {}` · 결과를 안 보는 `.catch(() => {})`
               - `await` 누락 · 기다리지 않고 흘려보내는 `Promise`
               - 경계값 — 빈 배열 · `null`/`undefined` · **0 과 falsy 혼동**
                 (`if (amount)` 은 0원을 삼킨다. 이 앱은 금액을 다루므로 특히 본다)
               - 같은 리터럴이 세 군데 이상 흩어져 있으면 상수로 (재사용 3회 규칙과 같은 축이다)
               - 조건이 세 겹 넘게 중첩되면 조기 반환으로 편다
               - 이름이 하는 일과 다르면 이름을 고친다 (`getX` 가 저장까지 하면 지적)

            ## 무엇을 보지 않나

            - 포맷·린트·타입·테스트 통과 여부 — `ci.yml` 이 이미 본다. 다시 말하지 않는다
            - 컨텍스트 파일에 없는 명세 — 짐작해서 지적하지 않는다.
              의심되면 **"확인 필요"로만 적는다**
            - 취향 문제. **위에 적히지 않은 스타일 선호는 적지 않는다.**
              "이렇게 하는 게 더 낫다"는 근거를 못 대면 취향이다
            - 이 PR 이 바꾸지 않은 줄. 원래 있던 문제는 이 PR 의 책임이 아니다

            ## 어떻게 쓰나

            - 지적마다 `파일:줄` 과 **어느 규칙인지**(하드룰 번호 · CLAUDE.md 절 · 위 3번의 항목)를 댄다.
              근거를 못 대는 지적은 적지 않는다
            - 심각한 것부터. 하드룰 → 명세 불일치 → 프로젝트 규칙 → 테스트 → 버그·위생
            - **지적할 것이 없으면 그렇게 쓴다.** 채우려고 만들어내지 않는다.
              무엇을 봤는지는 한 줄로 남긴다 (예: "임포트 방향 · 응답 형태 · 말투를 봤고 이상 없어요")
            - 한국어 해요체로 쓴다
