# OTA 발행 — 버튼으로 쏜다.
#
# 왜 버튼인가: CI 가 보는 것은 1층(순수 함수)과 2층(API 흐름)뿐이다.
# 화면은 사람이 에뮬레이터에서 봐야 하고(.claude/rules/testing.md), 머지에 발행을 걸면
# 정확히 그 층만 건너뛴 채로 가족 폰에 내려간다. 게다가 잘못 나간 번들은
# **다음에 앱을 켤 때** 고쳐지므로, 그때까지 가족은 깨진 화면을 본다.
#
# 그래서 편의(로컬에 eas CLI·로그인 없이 클릭 한 번)만 가져오고,
# "3층 확인 뒤에 누른다" 는 순서는 사람에게 남긴다.
#
#   준비물: Expo 계정의 Access Token 을 저장소 시크릿 EXPO_TOKEN 으로 넣는다
#           https://expo.dev/settings/access-tokens

name: OTA 발행

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '어느 채널로 쏠까요 (지금 가족이 쓰는 APK 는 preview 로 구웠습니다)'
        required: true
        default: preview
        type: choice
        options: [preview, production]
      message:
        description: '무엇을 고쳤는지 한 줄 (Expo 발행 목록에 그대로 남습니다)'
        required: true
        type: string
      force:
        description: '네이티브 가드를 무시하고 발행 (재빌드를 이미 끝냈거나, 순수 JS 변경뿐일 때)'
        required: false
        default: false
        type: boolean

# 같은 채널로 두 발이 겹치면 안 된다. 앞의 것을 취소하지도 않는다 — 이미 나갔을 수 있다
concurrency:
  group: ota-${{ github.event.inputs.branch }}
  cancel-in-progress: false

permissions:
  # 발행 지점을 태그로 남긴다 (다음 실행의 가드 기준이자 감사 기록)
  contents: write

jobs:
  publish:
    name: eas update → ${{ github.event.inputs.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HUSKY: 0
      TAG: ota-${{ github.event.inputs.branch }}
      # 사람이 친 문장은 셸에 직접 끼워넣지 않는다 — 따옴표 하나에 실행이 깨진다
      BRANCH: ${{ github.event.inputs.branch }}
      MESSAGE: ${{ github.event.inputs.message }}

    steps:
      - name: EXPO_TOKEN 확인
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::저장소 시크릿 EXPO_TOKEN 이 없습니다."
            echo "https://expo.dev/settings/access-tokens 에서 발급해"
            echo "Settings → Secrets and variables → Actions 에 EXPO_TOKEN 으로 넣어주세요."
            exit 1
          fi

      # 가드가 지난 발행 시점과 비교하므로 히스토리와 태그가 다 있어야 한다
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # force 로도 못 지나간다. force 는 "재빌드를 끝냈다" 는 뜻이지
      # "아무 브랜치에서나 가족에게 쏴도 된다" 는 뜻이 아니다 — 손잡이 하나로 두 위험을 끄지 않는다.
      # 정말 브랜치에서 쏴야 하면 로컬에서 eas update 를 직접 돌린다 (README 「고친 것을 가족에게 보내기」)
      - name: main 에서 쏘는지 확인
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::'$REF_NAME' 에서 발행하려 합니다. 가족이 받는 번들은 main 에서만 나갑니다."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # eas update 는 번들링을 여기서 돌린다. 앱 의존성이 다 있어야 한다
      - name: 앱 의존성
        run: npm ci --prefix mobile

      - name: 지난 발행 시점 찾기
        id: base
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "sha=$(git rev-parse "refs/tags/$TAG")" >> "$GITHUB_OUTPUT"
          else
            echo "이 채널의 첫 발행입니다 — 비교할 기준이 없어 가드를 건너뜁니다"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      # eas update 는 JS 번들만 바꾼다. 네이티브가 바뀐 코드를 내보내면 앱이 죽는데,
      # 발행 자체는 초록으로 성공해서 사람은 가족이 말해줄 때까지 모른다.
      # app.json 과 package.json 을 같이 본다 — config plugin 이 없는 네이티브 모듈은
      # app.json 을 안 건드리고 들어오므로, 한쪽만 보면 그 길이 열려 있다
      - name: 네이티브 가드
        id: guard
        if: ${{ steps.base.outputs.sha != '' && github.event.inputs.force != 'true' }}
        run: |
          BASE='${{ steps.base.outputs.sha }}'
          git show "$BASE:mobile/app.json" > /tmp/app-before.json
          git show "$BASE:mobile/package.json" > /tmp/package-before.json
          node scripts/ota-native-guard.mjs \
            /tmp/app-before.json mobile/app.json \
            /tmp/package-before.json mobile/package.json

      - name: 발행
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          # 메이저를 고정한다. 가족에게 나가는 번들을 만드는 도구가 매번 모르는 버전이면,
          # CLI 가 환경변수 해석을 바꾸는 날 조용히 주소 없는 번들이 나간다 (시행착오 1-9 와 같은 모양).
          # 올릴 때는 eas.json 의 cli.version 과 같이 올린다
          # --branch 는 "어느 채널로 내려갈까", --environment 는 "환경변수를 어디서 읽을까" 로
          # 서로 다른 스위치다. 지금은 두 환경에 같은 주소가 들어 있어 어긋나도 티가 안 나지만,
          # preview 를 스테이징 주소로 가르는 날 preview 채널에 production 주소가 실려 나간다.
          # 채널 이름과 환경 이름이 글자까지 같으니 그대로 넘겨 못박는다
          npx eas-cli@^23 update \
            --branch "$BRANCH" \
            --environment "$BRANCH" \
            --message "$MESSAGE" \
            --non-interactive 2>&1 | tee /tmp/eas-update.log

      # 시행착오 1-9 — 발행은 초록인데 주소가 빠진 번들이 나갔던 사고.
      # 그때도 경고가 로그에 찍혀 있었는데 사람이 읽고 넘어갔다. 발행을 여기로 옮기면
      # 로그는 요약의 접힌 블록 안으로 들어가고 사람 눈에는 "success" 만 보이므로,
      # 사람이 하던 확인을 기계가 대신 한다.
      #
      # 이미 나간 뒤라 되돌리진 못한다. 다만 가족이 말해주기 전에 알고,
      # 실패하면 태그가 안 옮겨져서 **나쁜 발행이 다음 가드의 기준이 되지 않는다.**
      # 판정은 스크립트가 한다. YAML 안의 정규식은 실제로 쏴봐야만 검증되는데,
      # 이 검사는 네이티브 가드와 같은 성격이라(조이면 오탐으로 길들여지고, 풀면 놓친다)
      # 같은 무게의 테스트가 필요하다 — tests/tools/ota-env-check.test.mjs
      - name: 환경변수가 번들에 실렸는지 확인
        id: envcheck
        run: |
          if node scripts/ota-env-check.mjs /tmp/eas-update.log EXPO_PUBLIC_API_URL "$BRANCH"; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ok=false' >> "$GITHUB_OUTPUT"
          echo "::error::EAS 환경변수가 안 실렸습니다 — 주소가 빠진 번들이 나갔어요 (시행착오 1-9)"
          exit 1

      - name: 요약 남기기
        if: always()
        run: |
          {
            echo "## OTA 발행 — ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 채널 | \`$BRANCH\` |"
            echo "| 커밋 | \`${{ github.sha }}\` |"
            echo "| 누른 사람 | @${{ github.actor }} |"
            # 건너뛴 것도 남긴다. 이 워크플로의 논지가 "사람 기억은 샌다" 인데,
            # 정작 "그때 가드가 돌았나" 를 사람 기억에 맡기면 앞뒤가 안 맞는다.
            #
            # 다만 이 스텝은 always() 라 EXPO_TOKEN·main 검사에서 멈춰도 돈다. 그때는
            # 가드 이야기를 할 수 있는 실행이 아니므로 **아무 말도 하지 않는다** —
            # sha 가 비었다고 "기준 태그 없음" 이라 적으면, 태그가 멀쩡한데도 그렇게 찍혀서
            # 브랜치에서 잘못 누른 사람을 엉뚱한 곳으로 보낸다
            if [ "${{ steps.guard.outcome }}" = "success" ]; then
              echo "| 네이티브 가드 | ✅ 통과 |"
            elif [ "${{ steps.guard.outcome }}" = "failure" ]; then
              echo "| 네이티브 가드 | ❌ 막음 — 재빌드가 필요한 변경 |"
            elif [ "${{ steps.guard.outcome }}" = "skipped" ]; then
              if [ "${{ github.event.inputs.force }}" = "true" ]; then
                echo "| 네이티브 가드 | ⚠️ force 로 건너뜀 |"
              else
                echo "| 네이티브 가드 | ⏭️ 기준 태그(\`$TAG\`) 없음 — 건너뜀 |"
              fi
            fi
            # 판정은 위 스텝에서 한 번만 한다. 여기서 grep 을 또 하면
            # 문구를 고칠 때 한쪽만 고쳐져 조용히 갈라진다.
            # 값이 비어 있으면 발행 전에 멈춘 것이다 — 그때 ❌ 로 적으면 없는 사고를 만들어낸다
            if [ "${{ steps.envcheck.outputs.ok }}" = "true" ]; then
              echo "| 환경변수 | ✅ 번들에 실림 |"
            elif [ "${{ steps.envcheck.outputs.ok }}" = "false" ]; then
              echo "| 환경변수 | ❌ 안 실림 — 주소 없는 번들 (시행착오 1-9) |"
            fi
            echo ""
            # 표 밖에 둔다 — 사람이 친 문장에 | 가 들어가면 표가 깨진다
            echo "> $MESSAGE"
            echo ""
            echo "<details><summary>eas update 로그</summary>"
            echo ""
            echo '```'
            cat /tmp/eas-update.log 2>/dev/null || echo '(발행 전에 멈췄습니다)'
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # 다음 실행의 가드 기준이 된다. 발행이 성공했을 때만 옮긴다
      - name: 발행 지점을 태그로 남기기
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f "$TAG" "${{ github.sha }}"
          git push -f origin "refs/tags/$TAG"
